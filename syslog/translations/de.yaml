configuration:
  syslog_host:
    name: Syslog Host
    description: Der Hostanme oder die IP-Adresse des Syslog-Server, an welchen die HAOS-Logs gesendet werden sollen.
  syslog_port:
    name: Syslog Port
    description: Der Port des Syslog-Server, an welchen die HAOS-Logs gesendet werden sollen.
  syslog_protocol:
    name: Übertragungsprotokol
    description: Das Übertragungsprotokol welches zum Senden der HAOS-Logs verwendet werden soll.
  syslog_ssl:
    name: SSL Verschlüsselung
    description: Aktivieren oder deaktivieren der SSL Verschlüsselung (wird nur bei tcp unterstützt).
  syslog_ssl_verify:
    name: SSL-Zertifikat überprüfen
    description: Prüfung des SSL-Zertifikate aktivieren oder dekativieren.
  syslog_format:
    name: Syslog-Format
    description: Das Format der Syslog-Nachrichten, entweder rfc3164 (BSD-Syslog) oder rfc5424 (ISO-8601-Zeitstempel, Structured-Data-Header).
  redact_patterns:
    name: Zu schwärzende Muster
    description: Reguläre Ausdrücke (Python-Syntax), deren Treffer vor dem Senden durch *** ersetzt werden, z. B. damit Tokens oder geheime URLs nicht im entfernten Syslog landen.
  exclude_patterns:
    name: Auszuschließende Muster
    description: "Reguläre Ausdrücke (Python-Syntax), geprüft gegen „App-Name: Nachricht“; ein passender Eintrag wird nicht gesendet. Die App meldet stündlich, wie viele ausgelassen wurden. Ein ungültiges Muster stoppt die App."
  backlog_max_hours:
    name: Maximaler Rückstand (Stunden)
    description: Nach einem Stopp werden die seit dem letzten gesendeten Eintrag geschriebenen Einträge beim Neustart nachgesendet, höchstens so viele Stunden zurück. 0 beginnt am Ende des Journals.
