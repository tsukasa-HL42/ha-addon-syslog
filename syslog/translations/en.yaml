configuration:
  syslog_host:
    name: Syslog host
    description: The hostname or IP address of the remote syslog server to send HAOS logs to.
  syslog_port:
    name: Syslog port
    description: The port of the remote syslog server to send HAOS logs to.
  syslog_protocol:
    name: Transfer protocol
    description: The protocol to be used to send HAOS logs.
  syslog_ssl:
    name: SSL encryption
    description: Whether or not to to use ssl encryption (only supported with tcp).
  syslog_ssl_verify:
    name: SSL verify
    description: Whether or not to verify ssl certificate.
  syslog_format:
    name: Syslog format
    description: The syslog message format, either rfc3164 (BSD syslog) or rfc5424 (ISO 8601 timestamps, structured data header).
  redact_patterns:
    name: Redact patterns
    description: Regular expressions (Python syntax) whose matches are replaced by *** before a message is sent, e.g. to keep tokens or secret URLs out of the remote syslog.
  backlog_max_hours:
    name: Maximum backlog (hours)
    description: After a stop, entries written since the last one sent are sent on restart, up to this many hours back. 0 starts at the end of the journal.
