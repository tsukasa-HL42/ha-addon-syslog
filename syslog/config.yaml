name: "Syslog (HL42)"
version: "1.1.1"
slug: "syslog"
description: "Send your HAOS logs to a remote syslog server, without losing them on restarts and outages"
url: "https://github.com/tsukasa-HL42/ha-addon-syslog"
arch:
  - aarch64
  - amd64
# No "image": the Supervisor builds the app locally from the Dockerfile.
init: false
startup: services
journald: true
options:
  syslog_host: syslog.local
  syslog_port: 514
  syslog_protocol: udp
  syslog_ssl: false
  syslog_ssl_verify: true
  syslog_format: rfc3164
  redact_patterns: []
  exclude_patterns: []
  backlog_max_hours: 6
  max_message_bytes: 8192
schema:
  syslog_host: str
  syslog_port: int
  syslog_protocol: list(udp|tcp)
  syslog_ssl: bool
  syslog_ssl_verify: bool
  syslog_format: list(rfc3164|rfc5424)
  redact_patterns:
    - str
  exclude_patterns:
    - str
  backlog_max_hours: int(0,168)
  max_message_bytes: "int(480,65000)?"
